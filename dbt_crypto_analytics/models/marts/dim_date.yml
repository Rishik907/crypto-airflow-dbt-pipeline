version: 2

models:
  - name: dim_date
    description: >
      Full date spine, 2020-01-01 through 2030-12-31, generated via
      dbt_utils.date_spine. Not derived from fetched data — exists
      independently so fct_crypto_price always has a date to join
      against regardless of when the pipeline actually ran.
    columns:
      - name: date_key
        description: Surrogate key on price_date. Unique, used as the join key from fct_crypto_price.
        tests:
          - unique
          - not_null

      - name: price_date
        description: Calendar date.
        tests:
          - unique
          - not_null

      - name: year
        description: Calendar year.
      - name: month
        description: Calendar month (1-12).
      - name: day
        description: Day of month.
      - name: day_of_week
        description: Day of week, 0-indexed (Snowflake default — check convention before relying on it downstream).
      - name: day_name
        description: Full day name (e.g. 'Monday').
      - name: month_name
        description: Full month name (e.g. 'January').
      - name: quarter
        description: Calendar quarter (1-4).
      - name: is_weekend
        description: True if day_of_week is Saturday or Sunday.